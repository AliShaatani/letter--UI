version: '3.8'

services:
  app-moraslat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-moraslat
    restart: unless-stopped

    environment:
      - NODE_ENV=production

    networks:
      - dokploy-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true
