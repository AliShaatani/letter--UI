version: '3.8'

services:
  app-moraslat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-moraslat
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "dokploy.enable=true"
